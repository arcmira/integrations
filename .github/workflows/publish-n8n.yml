name: Publish n8n community node

on:
  workflow_dispatch:
    inputs:
      first_publish:
        description: 'Create the package on npm as a staged version with the one-time NPM_TOKEN secret of the npm environment. Use only while npm has no version of n8n-nodes-arcmira.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-n8n
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'arcmira/integrations' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - name: Download and verify locally built release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python3 -c 'import json; print(json.load(open("release-artifacts/n8n/current.json"))["tag"])')"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'n8n-nodes-arcmira-*.tgz' --dir release
          python3 scripts/verify-n8n-release.py release --tag "$tag"
      - name: Rebuild approved package for provenance
        run: |
          set -euo pipefail
          mkdir rebuilt
          cd packages/n8n
          npx --yes pnpm@10.4.1 install --frozen-lockfile --ignore-scripts
          npx --yes pnpm@10.4.1 build
          npx --yes npm@11.15.0 pack --ignore-scripts --pack-destination ../../rebuilt
          cd ../..
          tag="$(python3 -c 'import json; print(json.load(open("release-artifacts/n8n/current.json"))["tag"])')"
          python3 scripts/verify-n8n-release.py release --tag "$tag" --rebuilt rebuilt/n8n-nodes-arcmira-*.tgz
      - name: Create the package with a staged first version
        if: ${{ inputs.first_publish }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NPM_TOKEN" ]; then echo "The npm environment has no NPM_TOKEN secret."; exit 1; fi
          if npx --yes npm@11.15.0 view n8n-nodes-arcmira version >/dev/null 2>&1; then echo "n8n-nodes-arcmira already exists on npm. Run without first_publish."; exit 1; fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
          npx --yes npm@11.15.0 stage publish ./rebuilt/n8n-nodes-arcmira-*.tgz --ignore-scripts --provenance --access public --userconfig "$RUNNER_TEMP/npmrc"
          rm -f "$RUNNER_TEMP/npmrc"
      - name: Publish with npm trusted publishing and provenance
        if: ${{ !inputs.first_publish }}
        run: npx --yes npm@11.15.0 publish ./rebuilt/n8n-nodes-arcmira-*.tgz --ignore-scripts --provenance --access public
