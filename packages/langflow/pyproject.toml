[project]
name = "lfx-arcmira"
version = "0.1.0"
description = "Arcmira YouTube transcript search and entity resolution for Langflow"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "Apache-2.0"}
dependencies = ["lfx>=1.12.3,<2", "httpx>=0.28.1,<1"]

[project.urls]
Arcmira = "https://arcmira.com"
Documentation = "https://arcmira.com/docs"
Repository = "https://github.com/arcmira/integrations"

[project.entry-points."langflow.extensions"]
lfx-arcmira = "lfx_arcmira"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_arcmira"]

[tool.hatch.build.targets.sdist]
include = ["src/lfx_arcmira", "extension.json", "README.md", "LICENSE", "pyproject.toml"]

[tool.uv]
exclude-newer = "2026-09-29T00:00:00Z"
