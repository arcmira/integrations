[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "strands-arcmira"
version = "0.1.0"
description = "YouTube transcript search for AI agents: the exact quote, often who said it, and a watch link cued to the second."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Arcmira" }]
requires-python = ">=3.10"
dependencies = ["arcmira==0.6.2", "strands-agents>=1.63.0,<2", "httpx>=0.28.1,<1", "pydantic>=2.7.4,<3"]
keywords = ["youtube-transcript-search", "podcast-transcript-search", "strands-agents", "arcmira", "speaker-search", "sponsor-research"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Programming Language :: Python :: 3", "Topic :: Internet"]

[project.urls]
Homepage = "https://arcmira.com"
Documentation = "https://github.com/arcmira/integrations/tree/master/packages/strands"
"API Documentation" = "https://arcmira.com/docs"
Repository = "https://github.com/arcmira/integrations"
Issues = "https://github.com/arcmira/integrations/issues"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "build>=1.2", "twine>=6"]

[tool.uv]
exclude-newer = "2026-11-01T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["strands_arcmira"]

[tool.hatch.build.targets.sdist]
include = ["/strands_arcmira", "/README.md", "/LICENSE", "/tests", "/pyproject.toml"]
