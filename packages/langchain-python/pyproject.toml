[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "langchain-arcmira"
version = "0.1.1"
description = "YouTube transcript search and entity resolution tools for LangChain and LangGraph."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Arcmira", email = "zeal@arcmira.com" }]
requires-python = ">=3.10"
dependencies = ["arcmira==0.4.3", "langchain-core>=1.6.5,<2", "httpx>=0.28.1,<1", "pydantic>=2.7.4,<3"]
keywords = ["youtube-transcript-search", "langchain", "langgraph", "arcmira", "speaker-search", "sponsor-research"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Programming Language :: Python :: 3", "Topic :: Internet"]

[project.urls]
Homepage = "https://arcmira.com"
Documentation = "https://github.com/arcmira/integrations/tree/master/packages/langchain-python"
Repository = "https://github.com/arcmira/integrations"
Issues = "https://github.com/arcmira/integrations/issues"

[dependency-groups]
dev = ["langchain-tests==1.1.9", "langgraph==1.2.12", "pytest>=8,<10", "pytest-asyncio>=0.23", "ruff>=0.12", "build>=1.2", "twine>=6"]

[tool.uv]
exclude-newer = "2026-09-28T00:00:00Z"

# First-party release; third-party dependencies retain the seven-day cutoff.
[tool.uv.sources]
arcmira = { url = "https://files.pythonhosted.org/packages/b3/c6/534489f1ad506b56692b0393c769a9ff7bd3c2ed284562296d8833b38537/arcmira-0.4.3-py3-none-any.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit_tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_arcmira"]

[tool.hatch.build.targets.sdist]
include = ["/langchain_arcmira", "/README.md", "/LICENSE", "/tests", "/pyproject.toml"]
